version: "3.7"
services:
    fmanager:
        build:
            args:
                user: filip
                uid: 1000
            context: ./
            dockerfile: ./docker/php/Dockerfile
        container_name: fmanager-container
        restart: unless-stopped
        working_dir: /var/www
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./:/var/www
        networks:
            - fmanager
    composer:
        image: composer:2
        command: [ "install" ]
        entrypoint: [ "composer" ]
        volumes:
            - ./:/var/www/html
        working_dir: /var/www/html
        profiles:
            - install
    pnpm:
        build:
            dockerfile: docker/pnpm/Dockerfile
            context: .
            target: dev
        volumes:
            - ./:/workspace
            - /var/run/docker.sock:/var/run/docker.sock
        working_dir: /workspace
        entrypoint: [ "/entrypoint.sh" ]
        environment:
            VITE_WAYFINDER_ENABLED: 1
        ports:
            - 5173:3000
        profiles:
            - install
    nginx:
        build:
            dockerfile: docker/nginx/Dockerfile
            context: .
            target: base
        container_name: fmanager-nginx
        restart: unless-stopped
        environment:
            VIRTUAL_HOST: fmanager.local
            VIRTUAL_PORT: 80
        ports:
            - 8000:80
        volumes:
            - ./:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - fmanager
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
        container_name: fmanager-elasticsearch
        restart: unless-stopped
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
            - 9200:9200
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        networks:
            - fmanager
        healthcheck:
            test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
    kibana:
        image: docker.elastic.co/kibana/kibana:9.5.1
        container_name: fmanager-kibana
        restart: unless-stopped
        environment:
            ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
        ports:
            - 5601:5601
        networks:
            - fmanager
        depends_on:
            elasticsearch:
                condition: service_healthy
    redis:
        image: redis:8.10.0-alpine
        container_name: fmanager-redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - 6379:6379
        volumes:
            - redis-data:/data
        networks:
            - fmanager
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    fmanager:
        driver: bridge
volumes:
    elasticsearch-data:
    redis-data:

